<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <title>何苗 · AI 应用软件工程师</title>
    <!--
      防主题闪烁：必须在任何样式生效前同步读取用户偏好并打上 class。
      若等 hydration 后再应用暗色，暗色用户会看到明显的闪白。
      键名 hm:theme 与 src/theme/index.ts 中的 THEME_STORAGE_KEY 保持一致。
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('hm:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = saved === 'dark' || ((saved === null || saved === 'auto') && prefersDark)
          var el = document.documentElement
          if (dark) el.classList.add('dark')
          el.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* 隐私模式下 localStorage 可能不可用，忽略即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
